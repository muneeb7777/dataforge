# Railway service config for the combined app service (API + embedded worker).
# Railway volumes are per-service, so the Celery worker runs as a second
# process inside this service to share the DuckDB/uploads volume at /data.
[build]
builder = "dockerfile"

[deploy]
startCommand = "sh -c 'alembic upgrade head && (celery -A app.core.celery_app worker -B --loglevel=info --pool=solo &) && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
restartPolicyType = "on_failure"
